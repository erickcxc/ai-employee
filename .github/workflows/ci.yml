name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun test
      - run: bun run build
        env: { PROVIDERS: fake }
  secrets:
    # Scans every commit for keys and tokens. The release is checked against its published checksum.
    runs-on: ubuntu-latest
    env: { GITLEAKS: "8.30.1" }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - run: |
          base=https://github.com/gitleaks/gitleaks/releases/download/v$GITLEAKS
          curl -sSfLO "$base/gitleaks_${GITLEAKS}_linux_x64.tar.gz"
          curl -sSfL "$base/gitleaks_${GITLEAKS}_checksums.txt" | grep "linux_x64.tar.gz" | sha256sum -c -
          tar xzf "gitleaks_${GITLEAKS}_linux_x64.tar.gz" gitleaks
      - run: ./gitleaks git . --redact -v
  dependencies:
    # Fails on any known high or critical vulnerability, and publishes a bill of materials (SBOM).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun audit --audit-level=high
      - run: npx --yes @cyclonedx/cdxgen@11 -t js -o sbom.json .
      - uses: actions/upload-artifact@v7
        with: { name: sbom, path: sbom.json }
