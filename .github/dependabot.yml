version: 2
# Routine updates arrive once a week as one pull request per ecosystem. Security fixes are not
# grouped: each one opens its own pull request as soon as the advisory is out. CI gates every merge.
updates:
  - package-ecosystem: bun
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    ignore:
      # typescript-eslint does not support TypeScript 7 yet ("does not support TS 7.0" in lint).
      # Take the next major by hand once it does; minor and patch releases still flow weekly.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    groups:
      libraries:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions:
        patterns: ["*"]
